name: CI

on:
  push:
    branches: [master, main, 'feat/**', 'fix/**', 'hotfix/**', 'refactor/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    # Runs on ARC self-hosted runners (GATE_RUNNER org variable) with fallback
    # to GitHub-hosted ubuntu-latest. PostgreSQL and Redis are started via apt
    # rather than Docker services: so the job works without a Docker socket.
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write

    env:
      DATABASE_URL: postgres://loopnest:loopnest_dev_password@localhost:5432/omni_local
      REDIS_URL: redis://localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: loopnest
      POSTGRES_PASSWORD: loopnest_dev_password
      POSTGRES_DB: omni_local
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      MANAGE_CONTAINERS: "no"
      JWT_SECRET: loopnest_dev_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install PostgreSQL 17, Redis, psql + jq
        run: |
          # Add official PostgreSQL apt repo to get v17 (matches the postgres:17-alpine
          # Docker image used in local dev, avoiding behaviour differences with older apt versions).
          sudo apt-get install -y --no-install-recommends curl ca-certificates
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-17 postgresql-client-17 redis-server jq uuid-runtime

      - name: Configure and start PostgreSQL 17
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c \
            "CREATE USER loopnest WITH PASSWORD 'loopnest_dev_password';" \
            2>/dev/null || true
          sudo -u postgres psql -c \
            "CREATE DATABASE omni_local OWNER loopnest;" \
            2>/dev/null || true
          until pg_isready -h localhost -p 5432 -U loopnest 2>/dev/null; do sleep 1; done

      - name: Start Redis
        run: |
          sudo service redis-server start
          until redis-cli ping 2>/dev/null | grep -q PONG; do sleep 1; done

      - name: Build bizcore-db (install, prisma generate, tsc)
        working-directory: packages/bizcore-db
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npm run build

      - name: Build api (install, tsc)
        working-directory: apps/api
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Unit tests
        working-directory: apps/api
        run: npm run test:unit

      - name: PR coverage comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- coverage-comment-api -->';
            let body;
            try {
              const summary = JSON.parse(fs.readFileSync('apps/api/coverage/coverage-summary.json', 'utf8'));
              const pct = summary.total.lines.pct;
              const threshold = 35;
              const status = pct >= threshold ? '✅' : '❌';
              body = MARKER + '\n### 📊 apps/api coverage: **' + pct + '%** ' + status + '\n\n閾値: ' + threshold + '%';
            } catch (e) {
              body = MARKER + '\n### 📊 apps/api coverage\ncoverage-summary.json の読み込みに失敗しました: ' + e.message;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Apply migrations
        run: bash infra/migrations/run.sh

      - name: Free port 3000
        run: |
          # Self-hosted ARC runners may have other services (e.g. Grafana) bound to
          # port 3000. Kill them so run-all.sh doesn't mistake the existing process
          # for a running API server and skip startup.
          sudo fuser -k 3000/tcp 2>/dev/null || true

      - name: Run integration suite
        run: SKIP_BUILD=1 bash tests/integration/run-all.sh

      - name: Smoke load test
        run: |
          node apps/api/dist/src/server.js > /tmp/load-server.log 2>&1 &
          SERVER_PID=$!
          until curl -s -m 2 http://localhost:3000/health | grep -q '"status":"ok"'; do
            kill -0 $SERVER_PID 2>/dev/null || { echo "server died"; cat /tmp/load-server.log; exit 1; }
            sleep 1
          done
          DURATION_S=5 CONCURRENCY=10 node tests/load/load.mjs
          kill $SERVER_PID 2>/dev/null || true

      - name: Server logs on failure
        if: failure()
        run: |
          echo "=== integration server ==="; tail -n 200 /tmp/loopnest-itest-server.log 2>/dev/null || true
          echo "=== load server ==="; tail -n 100 /tmp/load-server.log 2>/dev/null || true

      - name: Checkout dep-policy
        uses: actions/checkout@v4
        with:
          repository: flipslidersand/dev-infrastructure
          path: .dep-policy
          sparse-checkout: |
            dependency-policy
            scripts/dep-policy-check.py
          sparse-checkout-cone-mode: false
        continue-on-error: true

      - name: Dependency policy drift check
        if: hashFiles('.dep-policy/scripts/dep-policy-check.py') != ''
        run: |
          pip install pyyaml --quiet --disable-pip-version-check
          python3 .dep-policy/scripts/dep-policy-check.py \
            --policy-dir .dep-policy/dependency-policy || echo "::warning::dependency drift detected"
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # AI Review — local LLM only:
  #   set OLLAMA_URL repo variable  (e.g. http://host:11434)
  # If not configured the job is skipped.
  # ---------------------------------------------------------------------------
  ai-review:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]' &&
      vars.OLLAMA_URL != ''
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr.diff
          head -c 8000 /tmp/pr.diff > /tmp/pr_truncated.diff

      - name: AI review — local Ollama
        id: review_local
        run: |
          DIFF=$(cat /tmp/pr_truncated.diff)
          PROMPT="You are a code reviewer. Review the following git diff for bugs, security issues, and style problems. Be concise. Format as markdown bullet points. If no issues found, say 'No significant issues found.'\n\n\`\`\`diff\n${DIFF}\n\`\`\`"

          RESPONSE=$(curl -sf --max-time 60 "${{ vars.OLLAMA_URL }}/api/generate" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }}\",\"prompt\":$(echo "$PROMPT" | jq -Rs .),\"stream\":false}" \
            | jq -r '.response' 2>/dev/null) || RESPONSE=""

          if [ -z "$RESPONSE" ]; then
            BODY="⚠️ AI review skipped (Ollama unavailable at ${{ vars.OLLAMA_URL }})"
          else
            BODY="🤖 **AI Review (Ollama / ${{ vars.OLLAMA_MODEL || 'qwen2.5:7b' }})**"
            BODY="${BODY}"$'\n\n'"${RESPONSE}"
          fi
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_LOCAL: ${{ steps.review_local.outputs.body }}
        run: |
          BODY="${BODY_LOCAL}"
          [ -z "$BODY" ] && exit 0
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "$BODY"

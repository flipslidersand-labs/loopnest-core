name: CI

on:
  push:
    branches: [master, main, 'feat/**', 'fix/**', 'hotfix/**', 'refactor/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    if: github.event.pull_request.draft == false && github.actor != 'github-actions[bot]'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: loopnest
          POSTGRES_PASSWORD: loopnest_dev_password
          POSTGRES_DB: omni_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopnest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://loopnest:loopnest_dev_password@localhost:5432/omni_local
      REDIS_URL: redis://localhost:6379
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: loopnest
      POSTGRES_PASSWORD: loopnest_dev_password
      POSTGRES_DB: omni_local
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      MANAGE_CONTAINERS: "no"
      JWT_SECRET: loopnest_dev_secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install psql + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client jq

      - name: Build bizcore-db (install, prisma generate, tsc)
        working-directory: packages/bizcore-db
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
          npm run build

      - name: Build api (install, tsc)
        working-directory: apps/api
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Apply migrations
        run: bash infra/migrations/run.sh

      - name: Run integration suite
        run: SKIP_BUILD=1 bash tests/integration/run-all.sh

      - name: Smoke load test
        run: |
          node apps/api/dist/src/server.js > /tmp/load-server.log 2>&1 &
          SERVER_PID=$!
          until curl -s -m 2 -o /dev/null http://localhost:3000/health; do
            kill -0 $SERVER_PID 2>/dev/null || { echo "server died"; cat /tmp/load-server.log; exit 1; }
            sleep 1
          done
          DURATION_S=5 CONCURRENCY=10 node tests/load/load.mjs
          kill $SERVER_PID 2>/dev/null || true

      - name: Server logs on failure
        if: failure()
        run: |
          echo "=== integration server ==="; tail -n 200 /tmp/loopnest-itest-server.log 2>/dev/null || true
          echo "=== load server ==="; tail -n 100 /tmp/load-server.log 2>/dev/null || true

      - name: Checkout dep-policy
        uses: actions/checkout@v4
        with:
          repository: flipslidersand/dev-infrastructure
          path: .dep-policy
          sparse-checkout: |
            dependency-policy
            scripts/dep-policy-check.py
          sparse-checkout-cone-mode: false

      - name: Dependency policy drift check
        run: |
          pip install pyyaml --quiet --disable-pip-version-check
          python3 .dep-policy/scripts/dep-policy-check.py \
            --policy-dir .dep-policy/dependency-policy || echo "::warning::dependency drift detected"
        continue-on-error: true

  ai-review:
    # Requires OLLAMA_URL repo variable pointing to a local Ollama instance.
    # Skip silently when the variable is not set (e.g. public forks, GitHub-hosted runners).
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'github-actions[bot]' &&
      vars.OLLAMA_URL != ''
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR diff
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr.diff
          head -c 8000 /tmp/pr.diff > /tmp/pr_truncated.diff

      - name: AI review via local Ollama
        id: review
        run: |
          DIFF=$(cat /tmp/pr_truncated.diff)
          PROMPT="You are a code reviewer. Review the following git diff for bugs, security issues, and style problems. Be concise. Format as markdown bullet points. If no issues found, say 'No significant issues found.'\n\n\`\`\`diff\n${DIFF}\n\`\`\`"

          RESPONSE=$(curl -sf --max-time 60 "${{ vars.OLLAMA_URL }}/api/generate" \
            -H 'Content-Type: application/json' \
            -d "{\"model\":\"qwen2.5:7b\",\"prompt\":$(echo "$PROMPT" | jq -Rs .),\"stream\":false}" \
            | jq -r '.response' 2>/dev/null) || RESPONSE=""

          if [ -z "$RESPONSE" ]; then
            echo "review_body=⚠️ AI review skipped (Ollama unavailable)" >> "$GITHUB_OUTPUT"
          else
            {
              echo "review_body<<EOF"
              echo "🤖 **AI Review (qwen2.5:7b)**"
              echo ""
              echo "${RESPONSE}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "${{ steps.review.outputs.review_body }}"

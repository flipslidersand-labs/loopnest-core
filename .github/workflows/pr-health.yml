name: PR Health

on:
  schedule:
    # 毎日 09:00 JST (00:00 UTC) — stale判定
    - cron: '0 0 * * *'
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  stale:
    if: github.event_name == 'schedule'
    permissions:
      pull-requests: write
      issues: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/stale-pr.yml@d039ea2ade5f0faef5be443e0d07be2b8456c480 # main (2026-09-08)

  size-label:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
      pull-requests: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/size-label.yml@d039ea2ade5f0faef5be443e0d07be2b8456c480 # main (2026-09-08)
